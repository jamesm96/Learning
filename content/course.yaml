# The order of the course. Each entry is a folder under modules/,
# or a "planned" module that appears on the course map but is not written yet.
title: Code Literacy

# Sample files in content/files/. They are written into the working folder before
# every run, in lessons and in the Scratchpad, so file code really works.
files:
  - manifest.json
  - assets.csv
  - notes.txt
  - products.csv
  - sensors.csv

# The self-test on the Me tab: "You are code-literate when you can..."
selfTest:
  - { id: read-function, text: "Read any function Claude writes and say what it does in a sentence" }
  - { id: data-shape, text: "Describe the shape of any JSON data and write the path to a value in it" }
  - { id: traceback, text: "Read a traceback and name the likely cause before asking for help" }
  - { id: diff, text: "Read a diff and spot a change that was not asked for" }
  - { id: structure, text: "Explain why a file is structured the way it is, and propose a better split" }
  - { id: fifty-lines, text: "Write a fifty-line tool with no AI help: read a file, transform data, write a result" }
  - { id: walk-through, text: "Walk an engineer through one of your tools and answer their questions" }

# Practice banks in content/practice/, shown on the Practice tab.
practice:
  drills:
    - drills/data.md
    - drills/structure.md
    - drills/debugging.md
    - drills/git.md
    - drills/io.md
  bugHunt:
    - bug-hunt/easy.md
    - bug-hunt/medium.md
    - bug-hunt/hard.md

modules:
  - folder: 00-start
  - folder: 01-data
  - folder: 02-structure
  - folder: 03-debugging
  - folder: 04-git
  - folder: 05-io
  - folder: 06-next
